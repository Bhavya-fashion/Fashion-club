<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FASHION CLUB</h1>
    <p>Your Style, Your Story ✨</p>
  </header>

  <section class="hero">
    <h2>Discover Your Style</h2>
    <p>Explore outfits for every mood.</p>
    <a href="#collection" class="btn">Explore Collection</a>
  </section>

  <main id="collection">
    <h2>Our Collection</h2>

    <div class="filters">
      <button data-category="all">All</button>
      <button data-category="western">Western</button>
      <button data-category="ethnic">Ethnic</button>
    </div>

    <div class="products">
      <article class="product" data-category="western">
        <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=600&q=80" alt="Western fashion">
        <h3>Western Wear</h3>
        <p>Modern everyday style</p>
      </article>

      <article class="product" data-category="ethnic">
        <img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80" alt="Ethnic fashion">
        <h3>Ethnic Wear</h3>
        <p>Traditional elegance</p>
      </article>
    </div>
  </main>

  <footer>
    <p>© 2026 Fashion Club</p>
    <p>Style starts with you ♡</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
